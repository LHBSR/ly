<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Snapchat Plus</title>

  <!-- PRELOAD PRODUCT IMAGE -->
  <link rel="preload" as="image" href="product.JPG">

  <style>
    :root{
      --yellow:#eac100;
      --muted:#9aa3b2;
      --text:#e6eef8;
      --bg-dark:#0b0f14;
      --glass: rgba(255,255,255,0.03);
    }

    *{box-sizing:border-box;font-family:'Noto Sans Arabic', Tahoma, system-ui}
    html,body{height:100%;margin:0;padding:0;background:var(--bg-dark);color:var(--text);-webkit-font-smoothing:antialiased}
    html{
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    body{background:transparent;min-height:100vh;}

    .page{width:100%;max-width:720px;padding:20px;z-index:2;margin:0 auto;position:relative;min-height:100vh}
    header{display:flex;align-items:center;gap:12px;margin:8px 0 18px 0;position:relative;z-index:3;padding:8px 12px;background:transparent}

    .logo{width:72px;height:72px;border-radius:14px;overflow:hidden;flex:0 0 72px;display:flex;align-items:center;justify-content:center;background-color:#141414;border:1px solid rgba(255,255,255,0.04)}
    .logo img{width:100%;height:100%;object-fit:cover;display:block}

    .brand-text .title{font-size:22px;font-weight:900;color:#ffffff;margin:0}
    .brand-text .sub{font-size:13px;color:var(--muted);margin-top:4px}

    .center-card{
      background:rgba(0,0,0,0.55);
      padding:28px;border-radius:18px;
      box-shadow:0 20px 60px rgba(0,0,0,0.35);
      position:relative;z-index:5;margin:0 12px;
    }

    .heading{text-align:center;font-size:22px;font-weight:900;margin-bottom:6px}
    .subtext{text-align:center;color:var(--muted);margin-bottom:12px}

    .product-box{
      width:100%;
      aspect-ratio:1/1;
      border-radius:12px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:rgba(200,200,200,0.04);
      overflow:hidden;
    }

    .product-box img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .price-row{display:flex;gap:12px;margin-top:14px}
    .price-tag{
      flex:1;
      padding:12px;
      border-radius:12px;
      background:rgba(255,255,255,0.02);
      text-align:center;
    }

    #buyNow{
      width:100%;
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      border:0;
      font-weight:900;
      cursor:pointer;
      background:var(--yellow);
      color:#000;
      font-size:18px
    }

    footer{margin-top:14px;color:var(--muted);font-size:11px;text-align:left}
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="logo"><img src="logo.jpg" alt="logo"></div>
      <div class="brand-text">
        <div class="title">Lheb</div>
        <div class="sub">Store</div>
      </div>
    </header>

    <main class="center-card">
      <h2 class="heading">سيتم توفير باقي الخدمات قريباً ..</h2>
      <p class="subtext">- Snapchat Plus subscription -</p>

      <div class="product-box">
        <img 
          src="product.JPG"
          alt="صورة المنتج"
          width="600"
          height="600"
          decoding="sync"
        >
      </div>

      <div class="price-row">
        <div class="price-tag">
          <small>Month 6</small>
          <strong>LYD 95</strong>
        </div>
        <div class="price-tag">
          <small>Month 3</small>
          <strong>LYD 55</strong>
        </div>
      </div>

      <button id="buyNow">اشترك الآن</button>
      <footer>© جميع الحقوق محفوظة لهيب ستور</footer>
    </main>
  </div>
</body>
</html>
