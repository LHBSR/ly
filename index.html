<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lheb Store</title>
  <style>
    :root{
      --yellow:#eac100;
      --muted:#9aa3b2;
      --text:#e6eef8;
      --bg-dark:#0b0f14;
    }
    *{box-sizing:border-box;font-family:'Noto Sans Arabic',Tahoma,system-ui}
    html,body{margin:0;padding:0;min-height:100%;background:transparent;color:var(--text)}
    html{
      background-image:url('background.jpg');
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }
    .page{max-width:720px;margin:auto;padding:20px}
    header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .logo{width:72px;height:72px;border-radius:14px;overflow:hidden;background:#141414}
    .logo img{width:100%;height:100%;object-fit:cover}
    .title{font-size:24px;font-weight:900}
    .sub{color:var(--muted);font-size:14px}

    .card{
      background:rgba(0,0,0,.55);
      border-radius:18px;
      padding:26px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }

    .service{
      margin-top:18px;
      padding:20px;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      gap:14px;
      cursor:pointer;
      transition:.3s;
    }
    .service:hover{
      transform:translateY(-6px);
      box-shadow:0 20px 50px rgba(0,0,0,.6);
    }
    .service img{
      width:64px;
      height:64px;
      object-fit:contain;
      border-radius:20%;
    }
    .service h3{margin:0}
    .service p{margin:4px 0 0;color:var(--muted);font-size:14px}

    footer{
      text-align:center;
      margin-top:24px;
      font-size:12px;
      color:var(--muted);
}

/* 👇 حطه هنا بالضبط */
.pulse-btn {
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 6px rgba(255,255,255,0.2);
  }
  50% {
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
  }
  100% {
    box-shadow: 0 0 6px rgba(255,255,255,0.2);
  }
}

</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="logo"><img src="logo.jpg" alt="logo"></div>
      <div>
        <div class="title">Lheb Store</div>
        <div class="sub">خيارك الامثل لإختيار مُنتجاتك الرقمية</div>
      </div>
    </header>

    <div class="card">
      <h2>المعروض هُنا, هو جزء من الخدمات المتوفرة </h2>
      
        <div class="service" onclick="location.href='snapchat-plus.html'">
        <img src="product.JPG" alt="Snapchat Plus">
        <div>
          <h3>Snapchat Plus</h3>
          <p>Subscribe via gift 🎁</p>
        </div>
      </div>

      <div class="service" onclick="location.href='netflix.html'">
        <img src="netflix.JPG" alt="Netflix">
        <div>
          <h3>Netflix</h3>
          <p>Long-term guarantee ✅</p>
        </div>
      </div>
      
        <div class="service" onclick="location.href='shahid.html'">
        <img src="shahid.JPG" alt="Shahid Vip">
        <div>
          <h3>Shahid Vip</h3>
          <p>Fun and family-friendly 🍿</p>
        </div>
      </div>
    
<div style="text-align:center;margin-top:18px;color:#9aa3b2;font-size:14px;">
في حال حدوث مشكلة:
<a href="https://www.instagram.com/lhebstore2?igsh=MTE2dmY3MG1yMXppYw==" target="_blank" style="color:#0b84ff;font-weight:700;text-decoration:none">
تواصل معنا
</a>
</div>

<div style="text-align:center;margin-top:8px;">
  <a href="https://t.me/YOUR_CHANNEL_LINK" target="_blank" class="pulse-btn" style="
    display:inline-block;
    padding:6px 12px;
    font-size:12px;
    color:#ddd;
    background:#444;
    border-radius:16px;
    text-decoration:none;
    transition:0.3s;
  ">
    اضغط لمعرفة كيفية الاشتراك
  </a>
</div>

    <footer>© جميع الحقوق محفوظة لهيب ستور</footer>
  </div>
</body>
</html>
